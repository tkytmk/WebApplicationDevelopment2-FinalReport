<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Webスロット(仮)</title>
</head>
<body>
    <h1>Webスロット(仮)</h1>
    <p>ver.20260821.3</p>
    <p>パチスロっぽいものです。仕組みは全然違います。</p>
    <h2>操作説明</h2>
    <p>
        スペースキー：スタート。スロットが始動します。<br>
        v,b,nキー：ストップ。3つの桁がそれぞれ止まります。<br>
        クレジット数はマイナスでも回せます。
    </p>
    <div class="display_area">
        <p id="display_credit"></p>
        <p id="display_name"></p>
        <p id="display_comment"></p>
        <p id="display_gameCount"></p>
    </div>
    <div class="slot">
        <p class="lille" id="lilleLeft"></p>
        <p class="lille" id="lilleMiddle"></p>
        <p class="lille" id="lilleRight"></p>

        <p class="navi" id="naviLeft"></p>
        <p class="navi" id="navimiddle"></p>
        <p class="navi" id="naviRight"></p>
    </div>
    <script src="slot.js"></script>
</body>
</html>
